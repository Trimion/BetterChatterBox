<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки расширения</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="popup-container" id="mainMenu">
    <button id="openOptions" class="menu-button">Настройки</button>
    <button id="scanButton" class="menu-button">Сканирование</button>
    <button id="searchButton" class="menu-button">ПОИСК</button>
    <button id="smsButton" class="menu-button">Отправка СМС [BETA]</button>
    <button id="clearNotifications" class="menu-button">Сброс уведомлений</button>
    <div class="ticket-input-container">
      <input type="text" id="ticketIdInput" class="ticket-input" placeholder="ID тикета (например: 6898f85c37d74e5323172479)" maxlength="24">
      <button id="openTicketButton" class="ticket-button">Открыть тикет</button>
    </div>
  </div>
  
  <!-- Меню сканирования -->
  <div id="scanMenu" class="popup-container" style="display: none;">
    <div class="menu-header">
      <span class="back-button">&larr;</span>
      <span class="menu-title">Сканирование</span>
    </div>
    <button id="testingButton" class="menu-button">Тестирование</button>
    <button id="lastOrdersButton" class="menu-button">Последние заказы</button>
    <button id="calculationCorrectButton" class="menu-button">Расчёт верный</button>
  </div>
  
  <!-- Меню СМС -->
  <div id="smsMenu" class="popup-container" style="display: none;">
    <div class="menu-header">
      <span class="back-button-sms">&larr;</span>
      <span class="menu-title">Отправка СМС</span>
    </div>
    <div class="sms-button-container">
      <button id="partDeliveryButton" class="menu-button sms-button">Часть посылки</button>
      <span id="partDeliveryConfig" class="config-icon">⚙️</span>
    </div>
    <div class="sms-button-container">
      <button id="personalItemButton" class="menu-button sms-button">Личная вещь</button>
      <span id="personalItemConfig" class="config-icon">⚙️</span>
    </div>
    <div class="sms-button-container">
      <button id="askToCloseButton" class="menu-button sms-button">Просят закрыть [2ндз]</button>
      <span id="askToCloseConfig" class="config-icon">⚙️</span>
    </div>
    <div class="sms-button-container">
      <button id="damagedItemButton" class="menu-button sms-button">Повреждёнка</button>
      <span id="damagedItemConfig" class="config-icon">⚙️</span>
    </div>
    <div class="sms-button-container">
      <button id="accidentButton" class="menu-button sms-button">ДТП [Новый]</button>
      <span id="accidentConfig" class="config-icon">⚙️</span>
    </div>
  </div>
  
  <!-- Модальное окно редактирования текста СМС -->
  <div id="smsConfigModal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h3 id="smsConfigTitle">Настройка текста СМС</h3>
      <textarea id="smsConfigText" class="sms-config-textarea" rows="6"></textarea>
      <button id="saveConfigButton" class="menu-button">Сохранить</button>
    </div>
  </div>
  
  <script src="js/modules/ticketModule.js"></script>
  <script src="js/modules/financialModule.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
